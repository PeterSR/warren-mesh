# Publishes a draft release when a v* tag is pushed; RELEASING.md describes the process. In order:
#
#   test     the checks of test.yml, run again on the tagged commit
#   release  binaries, archives, checksums and SBOMs on a draft GitHub release, built by goreleaser;
#            the checksums signed with cosign and the archives' build provenance attested
#
# A tag with a suffix, such as v0.1.0-rc.1, makes a prerelease. The release stays a draft until the
# maintainer publishes it.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release and its assets
      id-token: write # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: check the tag
        run: |
          # Semantic Versioning 2.0.0, with an optional prerelease and no build metadata.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?\$"; then
            echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - name: release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A fixed Go, so a release can be rebuilt bit for bit. Raise it with each Go patch release.
          go-version: "1.26.10"
          # A release is built from a clean module and build cache.
          cache: false
      - name: the version in the code is the tag's
        # The binaries report internal/version.Version, so a tag on a commit
        # that still has the old one would ship binaries that name it.
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(go run ./cmd/warren version)"
          if [ "$got" != "$want" ]; then
            echo "::error::the tag $GITHUB_REF_NAME says $want, but warren version says $got; set Version in internal/version/version.go"
            exit 1
          fi
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
