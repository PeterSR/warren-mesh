name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes anything.
  workflow_call:
  # A weekly run, so govulncheck notices new advisories without a change.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # The oldest Go that go.mod allows, and the newest.
        go: ["1.26", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -short ./...

  conformance:
    # The full-length suites that define the two contracts, including the
    # checks that wait for timers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test -race -timeout 20m ./conformance/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint must be able to read the export data of the Go
          # it runs with, so the lint tools follow the release toolchain.
          go-version: "1.26.11"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: go vet for darwin
        run: GOOS=darwin go vet ./...
      - name: go build for darwin
        run: GOOS=darwin go build ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
